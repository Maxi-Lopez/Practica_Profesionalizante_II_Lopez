# Render Blueprint - Infrastructure as Code
# Este archivo define el servicio web para deploy automático en Render
# Documentación: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: centro-salud-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: USE_SUPABASE_STORAGE
        value: "True"
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false
      - key: SUPABASE_S3_BUCKET
        value: documentos
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        value: us-east-1
    healthCheckPath: /health/
    autoDeploy: true