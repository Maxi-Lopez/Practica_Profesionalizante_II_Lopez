<nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- Left: Logo -->
            <div class="flex items-center">
                <a href="{% url 'home' %}" class="flex items-center space-x-2">
                    <img src="{% static 'img/logo.jpg' %}" alt="Centro de Día Proyectar" class="h-8 w-auto">
                    <span class="text-xl font-bold text-primary-800 hidden sm:block">Centro de Día Proyectar</span>
                </a>
            </div>
            
            <!-- Center: Escritorio button (only authenticated) -->
            <div class="hidden md:flex items-center">
                {% if user.is_authenticated %}
                <a href="{% url 'home' %}" class="text-sm text-gray-600 hover:text-primary-600 font-medium transition-colors flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    Escritorio
                </a>
                {% endif %}
            </div>
            
            <!-- Right: User menu -->
            <div class="flex items-center space-x-4">
                {% if user.is_authenticated %}
                    <div class="hidden md:flex items-center space-x-6">
                        <a href="{% url 'pacientes_list' %}" class="text-gray-600 hover:text-primary-600 font-medium transition-colors">Concurrentes</a>
                        <a href="{% url 'turnos_list' %}" class="text-gray-600 hover:text-primary-600 font-medium transition-colors">Turnos</a>
                        <a href="{% url 'tratamientos_list' %}" class="text-gray-600 hover:text-primary-600 font-medium transition-colors">Tratamientos</a>
                        <a href="{% url 'empleados_list' %}" class="text-gray-600 hover:text-primary-600 font-medium transition-colors">Empleados</a>
                        <a href="{% url 'servicios_list' %}" class="text-gray-600 hover:text-primary-600 font-medium transition-colors">Servicios</a>
                    </div>
                    
                    <div class="flex items-center space-x-4">
                        <span class="text-sm text-gray-600 hidden sm:block">{{ user.get_full_name|default:user.username }}</span>
                        <form method="post" action="{% url 'logout' %}" class="inline">
                            {% csrf_token %}
                            <button type="submit" class="text-gray-600 hover:text-primary-600 font-medium transition-colors">
                                Cerrar sesión
                            </button>
                        </form>
                    </div>
                {% else %}
                    <a href="{% url 'login' %}" class="text-gray-600 hover:text-primary-600 font-medium transition-colors">Iniciar sesión</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
