{% extends 'base.html' %}

{% block title %}Contraseña Cambiada - Centro de Día Proyectar{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 mb-10">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Contraseña Actualizada</h1>
        <p class="text-gray-600 mb-6">Tu contraseña ha sido cambiada exitosamente.</p>
        <a href="{% url 'login' %}" class="bg-primary-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-primary-700 transition-colors inline-block">
            Iniciar Sesión
        </a>
    </div>
</div>
{% endblock %}
