[project]
name = "centro-proyectar"
version = "0.1.0"
description = "Sistema de gestión integral para el Centro de Día Proyectar (Full-Stack Django)"
readme = "README.md"
authors = [
    { name = "Maxi", email = "m.lopez@itecriocuarto.org.ar" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "django-filter>=23.5",
    "drf-spectacular>=0.27",
    "pillow>=13.0.0",
    "django-storages[s3]>=1.14.6",
    "boto3>=1.43.127",
    "dj-database-url>=2.3.0",
    "whitenoise>=6.6.0",
    "gunicorn>=22.0",
    "faker>=40.0.0",
    "model-bakery>=1.24.2",
]

[project.scripts]
centro-proyectar = "centro_salud_api:main"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["."]
addopts = "--strict-markers --disable-warnings -v"
markers = [
    "django_db: mark test as requiring database access",
]
